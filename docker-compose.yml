name: paperviz

# PaperViz — full stack. Nothing here needs a host install beyond Docker itself.
#   docker compose up --build
#
# GPU note: Ollama runs CPU-only by default so the stack starts anywhere.
# To use the RTX GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: paperviz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperviz}
      POSTGRES_USER: ${POSTGRES_USER:-paperviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperviz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperviz} -d ${POSTGRES_DB:-paperviz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [paperviz]

  ollama:
    image: ollama/ollama:latest
    container_name: paperviz-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # Never unload the model. It lives in VRAM, so keeping it resident costs
      # nothing from the system memory budget, and the default 5m idle timeout
      # means any pause in the pipeline is followed by a ~51 second reload
      # before the next token is produced.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # the ollama image has no curl; its own CLI is the health probe
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [paperviz]

  # One-shot: pulls the chat + embedding models into the ollama volume, then exits.
  # Subsequent `up` runs are instant because the volume already holds the blobs.
  ollama-init:
    image: ollama/ollama:latest
    container_name: paperviz-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "==> pulling chat model: $$CHAT_MODEL"
        ollama pull "$$CHAT_MODEL"
        echo "==> pulling embedding model: $$EMBED_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "==> models ready"
        ollama list
    restart: "no"
    networks: [paperviz]

  grobid:
    # CRF-only build (~500MB). The full deep-learning image is grobid/grobid:0.8.1 (~10GB)
    # and is a drop-in swap if you want better structure recall and have the disk.
    image: lfoppiano/grobid:0.8.1
    container_name: paperviz-grobid
    ports:
      - "${GROBID_PORT:-8070}:8070"
    environment:
      # 1g of heap is enough for the CRF models; the container ceiling below
      # covers the JVM's off-heap use on top of that.
      JAVA_OPTS: "-Xmx1536m"
    # GROBID spikes to ~250% CPU during a parse. The CPU cap is what matters:
    # it keeps a 20-second parse from taking every core from the model that
    # runs for minutes afterwards. The memory ceiling is only a guard rail —
    # measured use is ~2.8 GiB and a tighter cap gets the JVM OOM-killed
    # mid-parse.
    cpus: 4.0
    mem_limit: 3g
    healthcheck:
      # This image ships neither curl nor wget — bash's /dev/tcp is the only probe available.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8070; printf 'GET /api/isalive HTTP/1.0\r\n\r\n' >&3; grep -q true <&3"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [paperviz]

  render-service:
    build:
      context: ./render-service
    container_name: paperviz-render
    environment:
      MEDIA_ROOT: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${RENDER_PORT:-8000}:8000"
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [paperviz]

  backend:
    build:
      context: ./backend
    container_name: paperviz-backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      grobid:
        condition: service_healthy
      render-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paperviz}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperviz}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperviz}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      PAPERVIZ_GROBID_BASE_URL: http://grobid:8070
      PAPERVIZ_RENDER_BASE_URL: http://render-service:8000
      PAPERVIZ_UNPAYWALL_BASE_URL: https://api.unpaywall.org
      PAPERVIZ_UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      PAPERVIZ_MEDIA_ROOT: /data/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [paperviz]

  frontend:
    build:
      context: ./frontend
    container_name: paperviz-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and would be refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [paperviz]

  # Development loop: Angular's dev server (live reload, /api proxied to the
  # backend container) instead of the baked nginx build, so editing a
  # .ts/.html/.css file shows up in the browser without a rebuild.
  #   docker compose --profile dev up frontend-dev
  # Do not run together with the production `frontend` (same host port).
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: paperviz-frontend-dev
    profiles: ["dev"]
    depends_on:
        backend:
          condition: service_started
    ports:
      - "4200:4200"
    volumes:
      # Live source so edits hot-reload; node_modules stays inside the image so
      # the cached npm-ci layer is reused and Windows bind files never corrupt it.
      - ./frontend:/app
      - /app/node_modules
    networks: [paperviz]

volumes:
  pgdata:
  ollama:
  media:

networks:
  paperviz:
    driver: bridge
