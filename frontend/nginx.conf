server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploaded papers can be large; the API enforces its own limit too.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Without this, nginx resolves `backend` once at
    # startup and caches it forever — restarting the API container gives it a
    # new IP and every /api call 502s until nginx is also restarted.
    # Resolving through a variable defers lookup to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Angular hashes its build output, so it is safe to cache hard.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Server-sent events / websockets for render progress (stage 7).
    # Declared before /api/ so it wins for streaming paths.
    location /api/stream/ {
        set $pv_backend http://backend:8080;
        proxy_pass         $pv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # Everything else under /api goes to the Spring Boot container.
    location /api/ {
        set $pv_backend http://backend:8080;
        proxy_pass         $pv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A Manim render is minutes, and the synchronous render endpoint holds
        # the request open for it. This must outlast the backend's own 12-minute
        # client timeout, or nginx returns 504 on a render that actually worked.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Client-side routing fallback.
    #
    # index.html must never be cached. It is the only file whose name does not
    # change between builds, and it carries the hashed names of everything else
    # — so a stale copy pins the browser to an old bundle no matter how many
    # times the app is rebuilt. Everything it points at is content-hashed and
    # cached hard above.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
